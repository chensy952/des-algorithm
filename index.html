<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业一：AI实战 - DES算法的实现</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel2: #273449;
    --border: #334155;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --green: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, var(--bg) 55%);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 720px; }
  .info-banner {
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 32px;
    justify-content: center;
    box-shadow: 0 8px 30px rgba(56, 189, 248, .25);
    margin-bottom: 20px;
  }
  .info-banner span { font-weight: 600; letter-spacing: .5px; }
  .info-banner .fld { color: rgba(255,255,255,.8); font-weight: 500; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 18px 0 6px; }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.15); }
  input[readonly] { color: var(--green); background: #14212e; }
  .btn-row { display: flex; gap: 14px; margin-top: 24px; }
  button {
    flex: 1;
    padding: 13px 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #0f172a;
    transition: transform .08s, filter .15s;
  }
  button:active { transform: translateY(1px); }
  button.enc { background: linear-gradient(135deg, #38bdf8, #2563eb); }
  button.dec { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
  button:hover { filter: brightness(1.08); }
  .hint {
    margin-top: 20px;
    padding: 12px 14px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--muted);
    background: rgba(15, 23, 42, .5);
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .hint b { color: var(--accent); }
</style>
</head>
<body>
  <div class="app">
    <!-- 界面最上方：班级 / 姓名 / 学号 -->
    <div class="info-banner">
      <span><span class="fld">班级：</span>网安1班</span>
      <span><span class="fld">姓名：</span>陈思媛</span>
      <span><span class="fld">学号：</span>2414100603</span>
    </div>

    <div class="card">
      <h1><span class="dot"></span>DES 对称加密演示</h1>
      <p class="subtitle">标准 DES（Feistel 结构 · 16 轮 · 64 位分组），输入输出均为十六进制字符串</p>

      <label for="key">密钥显示框（当前密钥）</label>
      <input type="text" id="key" value="AABB09182736CCDD" readonly>

      <label for="plain">明文输入框（待加密的十六进制数据）</label>
      <input type="text" id="plain" value="123456ABCD132536" spellcheck="false">

      <div class="btn-row">
        <button class="enc" onclick="doEncrypt()">加　密</button>
        <button class="dec" onclick="doDecrypt()">解　密</button>
      </div>

      <label for="cipher">密文显示框（加密后的结果）</label>
      <input type="text" id="cipher" readonly placeholder="点击「加密」后在此显示密文">

      <label for="decrypted">解密输出框（解密后的明文结果）</label>
      <input type="text" id="decrypted" readonly placeholder="点击「解密」后在此显示明文">

      <div class="hint">
        说明：DES 为 64 位分组密码，每组 8 字节（16 个十六进制字符）。<br>
        测试数据　明文 <b>123456ABCD132536</b>　密钥 <b>AABB09182736CCDD</b>　→　密文 <b>C0B7A8D05F3A829C</b><br>
        加密后密文长度与明文长度一致；长度不足一组时自动补 0x00。
      </div>
    </div>
  </div>

<script>
// ================= DES 标准置换表与 S 盒（与 Python 版完全一致） =================
const IP = [
  58,50,42,34,26,18,10,2, 60,52,44,36,28,20,12,4,
  62,54,46,38,30,22,14,6, 64,56,48,40,32,24,16,8,
  57,49,41,33,25,17,9,1, 59,51,43,35,27,19,11,3,
  61,53,45,37,29,21,13,5, 63,55,47,39,31,23,15,7];
const FP = [
  40,8,48,16,56,24,64,32, 39,7,47,15,55,23,63,31,
  38,6,46,14,54,22,62,30, 37,5,45,13,53,21,61,29,
  36,4,44,12,52,20,60,28, 35,3,43,11,51,19,59,27,
  34,2,42,10,50,18,58,26, 33,1,41,9,49,17,57,25];
const E = [
  32,1,2,3,4,5, 4,5,6,7,8,9, 8,9,10,11,12,13, 12,13,14,15,16,17,
  16,17,18,19,20,21, 20,21,22,23,24,25, 24,25,26,27,28,29, 28,29,30,31,32,1];
const P = [
  16,7,20,21, 29,12,28,17, 1,15,23,26, 5,18,31,10,
  2,8,24,14, 32,27,3,9, 19,13,30,6, 22,11,4,25];
const PC1 = [
  57,49,41,33,25,17,9, 1,58,50,42,34,26,18, 10,2,59,51,43,35,27, 19,11,3,60,52,44,36,
  63,55,47,39,31,23,15, 7,62,54,46,38,30,22, 14,6,61,53,45,37,29, 21,13,5,28,20,12,4];
const PC2 = [
  14,17,11,24,1,5, 3,28,15,6,21,10, 23,19,12,4,26,8, 16,7,27,20,13,2,
  41,52,31,37,47,55, 30,40,51,45,33,48, 44,49,39,56,34,53, 46,42,50,36,29,32];
const SHIFT_SCHEDULE = [1,1,2,2,2,2,2,2,1,2,2,2,2,2,2,1];
const S_BOXES = [
  [[14,4,13,1,2,15,11,8,3,10,6,12,5,9,0,7],
   [0,15,7,4,14,2,13,1,10,6,12,11,9,5,3,8],
   [4,1,14,8,13,6,2,11,15,12,9,7,3,10,5,0],
   [15,12,8,2,4,9,1,7,5,11,3,14,10,0,6,13]],
  [[15,1,8,14,6,11,3,4,9,7,2,13,12,0,5,10],
   [3,13,4,7,15,2,8,14,12,0,1,10,6,9,11,5],
   [0,14,7,11,10,4,13,1,5,8,12,6,9,3,2,15],
   [13,8,10,1,3,15,4,2,11,6,7,12,0,5,14,9]],
  [[10,0,9,14,6,3,15,5,1,13,12,7,11,4,2,8],
   [13,7,0,9,3,4,6,10,2,8,5,14,12,11,15,1],
   [13,6,4,9,8,15,3,0,11,1,2,12,5,10,14,7],
   [1,10,13,0,6,9,8,7,4,15,14,3,11,5,2,12]],
  [[7,13,14,3,0,6,9,10,1,2,8,5,11,12,4,15],
   [13,8,11,5,6,15,0,3,4,7,2,12,1,10,14,9],
   [10,6,9,0,12,11,7,13,15,1,3,14,5,2,8,4],
   [3,15,0,6,10,1,13,8,9,4,5,11,12,7,2,14]],
  [[2,12,4,1,7,10,11,6,8,5,3,15,13,0,14,9],
   [14,11,2,12,4,7,13,1,5,0,15,10,3,9,8,6],
   [4,2,1,11,10,13,7,8,15,9,12,5,6,3,0,14],
   [11,8,12,7,1,14,2,13,6,15,0,9,10,4,5,3]],
  [[12,1,10,15,9,2,6,8,0,13,3,4,14,7,5,11],
   [10,15,4,2,7,12,9,5,6,1,13,14,0,11,3,8],
   [9,14,15,5,2,8,12,3,7,0,4,10,1,13,11,6],
   [4,3,2,12,9,5,15,10,11,14,1,7,6,0,8,13]],
  [[4,11,2,14,15,0,8,13,3,12,9,7,5,10,6,1],
   [13,0,11,7,4,9,1,10,14,3,5,12,2,15,8,6],
   [1,4,11,13,12,3,7,14,10,15,6,8,0,5,9,2],
   [6,11,13,8,1,4,10,7,9,5,0,15,14,2,3,12]],
  [[13,2,8,4,6,15,11,1,10,9,3,14,5,0,12,7],
   [1,15,13,8,10,3,7,4,12,5,6,11,0,14,9,2],
   [7,11,4,1,9,12,14,2,0,6,10,13,15,3,5,8],
   [2,1,14,7,4,10,8,13,15,12,9,0,3,5,6,11]]
];

// ================= 核心函数（BigInt 支持 64 位运算） =================
function permute(block, table, nIn) {
  let out = 0n;
  for (const pos of table) out = (out << 1n) | ((block >> BigInt(nIn - pos)) & 1n);
  return out;
}
function leftRotate28(v, shift) {
  return ((v << BigInt(shift)) | (v >> BigInt(28 - shift))) & 0x0FFFFFFFn;
}
function sboxSubstitute(value) {
  let out = 0n;
  for (let i = 0; i < 8; i++) {
    const six = Number((value >> BigInt(42 - 6 * i)) & 0x3Fn);
    const row = ((six >> 4) & 0b10) | (six & 0b1);
    const col = (six >> 1) & 0b1111;
    out = (out << 4n) | BigInt(S_BOXES[i][row][col]);
  }
  return out;
}
function fFunction(r, k) {
  return permute(sboxSubstitute(permute(r, E, 32) ^ k), P, 32);
}
function generateKeys(key64) {
  const pc1 = permute(key64, PC1, 64);
  let c = (pc1 >> 28n) & 0x0FFFFFFFn;
  let d = pc1 & 0x0FFFFFFFn;
  const keys = [];
  for (const shift of SHIFT_SCHEDULE) {
    c = leftRotate28(c, shift);
    d = leftRotate28(d, shift);
    keys.push(permute((c << 28n) | d, PC2, 56));
  }
  return keys;
}
function desBlock(block64, keys, decrypt) {
  let block = permute(block64, IP, 64);
  let l = (block >> 32n) & 0xFFFFFFFFn;
  let r = block & 0xFFFFFFFFn;
  if (decrypt) keys = keys.slice().reverse();
  for (const k of keys) {
    const nl = r;
    const nr = l ^ fFunction(r, k);
    l = nl; r = nr;
  }
  return permute((r << 32n) | l, FP, 64);
}
function toHex16(v) { return v.toString(16).toUpperCase().padStart(16, "0"); }
function hexToBigInt(h) { return BigInt("0x" + h); }

function desEncryptHex(hexPlain, hexKey) {
  const keys = generateKeys(hexToBigInt(hexKey));
  let data = hexPlain;
  if (data.length % 16 !== 0) data += "0".repeat(16 - (data.length % 16)); // 补 0x00
  let out = "";
  for (let i = 0; i < data.length; i += 16)
    out += toHex16(desBlock(hexToBigInt(data.slice(i, i + 16)), keys, false));
  return out;
}
function desDecryptHex(hexCipher, hexKey) {
  const keys = generateKeys(hexToBigInt(hexKey));
  let out = "";
  for (let i = 0; i < hexCipher.length; i += 16)
    out += toHex16(desBlock(hexToBigInt(hexCipher.slice(i, i + 16)), keys, true));
  return out;
}

// ================= 界面交互 =================
const $ = id => document.getElementById(id);
function validHex(s) {
  s = s.trim();
  if (!/^[0-9a-fA-F]*$/.test(s)) return { ok: false, msg: "仅允许十六进制字符 0-9 / A-F" };
  if (s.length % 2 !== 0) return { ok: false, msg: "十六进制长度必须为偶数（每字节 2 个字符）" };
  if (s.length === 0) return { ok: false, msg: "输入不能为空" };
  return { ok: true, msg: "" };
}
function doEncrypt() {
  const plain = $("plain").value.trim().toUpperCase();
  const key = $("key").value.trim().toUpperCase();
  const pv = validHex(plain), kv = validHex(key);
  if (!pv.ok) return alert("明文错误：" + pv.msg);
  if (!kv.ok) return alert("密钥错误：" + kv.msg);
  if (key.length !== 16) return alert("DES 密钥须为 64 位（16 个十六进制字符）");
  $("cipher").value = desEncryptHex(plain, key);
  $("decrypted").value = "";
}
function doDecrypt() {
  const cipher = $("cipher").value.trim().toUpperCase();
  const key = $("key").value.trim().toUpperCase();
  if (cipher === "") return alert("请先点击「加密」生成密文");
  const cv = validHex(cipher), kv = validHex(key);
  if (!cv.ok) return alert("密文错误：" + cv.msg);
  if (!kv.ok) return alert("密钥错误：" + kv.msg);
  if (key.length !== 16) return alert("DES 密钥须为 64 位（16 个十六进制字符）");
  $("decrypted").value = desDecryptHex(cipher, key);
}
</script>
</body>
</html>
